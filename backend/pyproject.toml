[project]
name = "ai-3d-studio-backend"
version = "0.1.0"
description = "AI 3D Studio CAD/AI backend"
requires-python = ">=3.12,<3.14"
dependencies = [
  "anthropic>=1,<2",
  "cadquery>=2.8,<3",
  "fastapi>=0.162,<1",
  "pydantic>=2.14,<3",
  "uvicorn[standard]>=0.54,<1",
]

[dependency-groups]
dev = [
  "pytest>=9.2",
  "httpx>=0.28",
  "jsonschema>=4.26",
]
packaging = [
    "pyinstaller>=6.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = false
